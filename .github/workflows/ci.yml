name: CI

# XSSentinel quality gate (Phase 42 / P2-10):
#   1. unit + integration pytest (includes the pipeline slice over
#      Attack Range #2 -- main-flow regressions fail here)
#   2. accuracy benchmark (192 cases) -- gate: FPR<=20% and recall>=50%
#      (hard thresholds; project runs at 100%/100%)
#   3. accuracy drill on Range #2 (15 vuln + 5 safe, 100%/100% required)
# 4. nightly: the FULL file-by-file gate (tests/run_all_batched.py, 129+
#    files with per-file timeout and retry) + the full 192-case matrix --
#    the same entry point the author's machine gates on, so a wedge or a
#    per-file regression cannot hide behind the 10-case quick slice.
# Async/asyncio.run tests self-skip via tests/conftest.py when the runner's
# loopback socketpair is throttled.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 02:30 UTC nightly -- the full gate is too slow for every push.
    - cron: "30 2 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # The test suite exercises every engine channel: aiohttp (async),
        # cryptography (MITM), esprima (sandbox JS gate), playwright
        # (browser-confirmed DOM).  The dev extra alone misses them.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async,ast]"
          pip install cryptography playwright
          python -m playwright install chromium --with-deps

      - name: Unit + integration tests (pipeline slice included)
        run: pytest tests/ -q --ignore=tests/test_benchmark.py --timeout=120

      - name: Accuracy benchmark (98 cases, report saved)
        run: python -m benchmark.runner --quick

      - name: Range #2 accuracy drill (must be 100% / 100%)
        run: python tests/run_range2.py

      # Range #4: real React 18 / Vue 3 bundles (vendored), client-side
      # sinks only -- the framework escapes or it does not.  Ground truth
      # is authored from framework semantics, and the -safe twins are
      # proven first by dev/_r4_construct_probe.py (no browser): the
      # attacker string must not appear in server HTML at all.
      - name: Range #4 SPA drill (real framework sinks, 100%/100% required)
        run: python range4/runner.py --engine both --out range4/results_ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range4-results
          path: range4/results_ci.json
          if-no-files-found: ignore

  benchmark-full:
    # Full 192-case drill on demand (slower, ~15 min of pure scanning).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full benchmark
        run: python -m benchmark.runner
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/*.json

  nightly-gate:
    # The full file-by-file suite: same entry point as the local gate
    # (tests/run_all_batched.py), so CI sees per-file timeouts, one retry,
    # and evidence logs that survive the run -- not one wedged pytest
    # process killed by the job ceiling.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full file-by-file test gate
        run: python tests/run_all_batched.py --quiet
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: benchmark/results/regression_logs/
          if-no-files-found: ignore
